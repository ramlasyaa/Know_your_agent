version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: kya_postgres_db
    restart: always
    environment:
      POSTGRES_DB: kya_db
      POSTGRES_USER: kya_user
      POSTGRES_PASSWORD: kya_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kya_user -d kya_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: kya_fastapi_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://kya_user:kya_password@db:5432/kya_db
      - HARD_AMOUNT_LIMIT=1000.00
      - VELOCITY_WINDOW_MINUTES=5
      - MAX_ACTIONS_PER_WINDOW=5
      - ANOMALY_SCORE_THRESHOLD=65.0
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    container_name: kya_streamlit_dashboard
    restart: always
    command: streamlit run dashboard/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
