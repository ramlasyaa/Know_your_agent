services:
  # Know Your Agent - Unified Web Service (Streamlit Visual UI + FastAPI Backend)
  - type: web
    name: know-your-agent
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "sh -c 'python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 & streamlit run dashboard/streamlit_app.py --server.port $PORT --server.address 0.0.0.0'"
    envVars:
      - key: API_BASE_URL
        value: "http://127.0.0.1:8000"
      - key: HARD_AMOUNT_LIMIT
        value: "1000.00"
      - key: VELOCITY_WINDOW_MINUTES
        value: "5"
      - key: MAX_ACTIONS_PER_WINDOW
        value: "5"
      - key: ANOMALY_SCORE_THRESHOLD
        value: "65.0"
      - key: LOG_LEVEL
        value: "INFO"
